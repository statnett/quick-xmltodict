[package]
name = "quick-xmltodict"
version = "0.2.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]
name = "quick_xmltodict"

[dependencies]
anyhow = "*"
pyo3 = { version = "<=0.29", features = ["anyhow"] }
quick-xml = "0.41.0"

[features]
default = ["pyo3/extension-module"]

[profile.release]
opt-level = 3
strip = "symbols"
lto = "fat"
codegen-units = 1
